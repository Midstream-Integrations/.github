name: Bug report
description: Something in the app doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please don't include customer data, card numbers, API keys or tenant IDs."
  - type: input
    id: bc-version
    attributes:
      label: Business Central version
      placeholder: e.g. 26.3
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Shown on Extension Management
      placeholder: e.g. 1.0.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Choose ...\n3. See error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
      description: Include the full error message if there was one.
    validations:
      required: true
